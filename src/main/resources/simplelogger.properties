org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
# The retry we care about logs at DEBUG; bump it so we can see each attempt in the demo output.
org.slf4j.simpleLogger.log.io.temporal.client.schedules.ScheduleHandleImpl=debug
# Quiet the rest of the SDK so demo output stays readable.
org.slf4j.simpleLogger.log.io.temporal=warn
